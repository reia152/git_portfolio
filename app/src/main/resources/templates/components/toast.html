<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- th:fragment="toast"：他のテンプレートから呼び出せるようにする -->
<div th:fragment="toast">
  <!-- flashMessage：コントローラーから addFlashAttribute で渡されるメッセージ -->
  <!-- flashType：配色を決める種別。success/error/danger/warning/info のいずれかをflashMessageとセットでaddFlashAttributeに渡す（下のtoast.cssの.toast-<種別>と対応） -->
  <div th:if="${flashMessage != null}">
    <div class="toast-container">
      <div id="toast-contents"
           th:classappend="${'toast-' + flashType}"
           class="toast"
           data-bs-delay="5000"
           role="alert"
           aria-live="assertive"
           aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body text-white" th:text="${flashMessage}"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto"
                  data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
